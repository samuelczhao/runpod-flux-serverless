[project]
name = "runpod-flux-serverless"
version = "0.1.0"
description = "Runpod Serverless worker for FLUX.1-dev image generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "diffusers==0.39.0",
    "pillow==12.3.0",
    "requests==2.34.2",
    "runpod==1.11.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_flux"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
